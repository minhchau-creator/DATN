version: "3.9"

services:
  segmentation-server:
    build:
      context: ..          # project root
      dockerfile: deploy/Dockerfile
    image: datn-segmentation:latest
    container_name: pancreas-seg-server
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      # Mount trained checkpoints from host
      - ../checkpoints:/app/checkpoints:ro
    environment:
      MODEL_NAME:       ${MODEL_NAME:-nnunet_finetuned}
      MODEL_FOLD:       ${MODEL_FOLD:-0}
      CKPT_DIR:         /app/checkpoints
      CKPT_PATH:        ${CKPT_PATH:-}
      HU_MIN:           ${HU_MIN:--74}
      HU_MAX:           ${HU_MAX:-140}
      DEVICE:           ${DEVICE:-cuda}
      SW_BATCH:         ${SW_BATCH:-4}
      SW_OVERLAP:       ${SW_OVERLAP:-0.25}
      USE_TWO_STAGE:    ${USE_TWO_STAGE:-false}
      STAGE2_FOLD:      ${STAGE2_FOLD:-0}
      STAGE2_CKPT_PATH: ${STAGE2_CKPT_PATH:-}
      BBOX_MARGIN:      ${BBOX_MARGIN:-20}
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s
